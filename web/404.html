<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面不存在</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:oklch(.97 0 0);color:oklch(.25 .012 60);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
    main{max-width:32rem;padding:32px;text-align:center}
    .code{font:800 3rem ui-monospace,SFMono-Regular,Consolas,monospace;color:#97502e}
    a{display:inline-block;margin-top:8px;padding:10px 18px;border-radius:7px;background:#97502e;color:#fff;text-decoration:none;font-weight:600}
    a:hover{background:oklch(.25 .012 60)}
    p{color:oklch(.46 .015 60);font-size:.9rem}
  </style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>这个页面不存在</h1>
  <p>地址可能输入有误，或页面已被移动。课程与源码都在 GitHub 仓库里。</p>
  <p><a id="home" href="/">返回学习实验室</a></p>
  <p><a href="https://github.com/hwj123hwj/go-learning-for-java-dev" style="background:none;color:inherit;text-decoration:underline;padding:0;font-weight:400">github.com/hwj123hwj/go-learning-for-java-dev</a></p>
</main>
<script>
  // 按当前路径推断站点根：IP 部署在 /，GitHub Pages 在 /go-learning-for-java-dev/
  document.getElementById('home').href = location.pathname.replace(/\/[^/]*$/, '') + '/';
</script>
</body>
</html>
